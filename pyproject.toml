[project]
name = "totebag"
version = "0.1.0"
description = "A Terminal User Interface for managing uv Python projects"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "kracekumar", email = "me@kracekumar.com" }
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "textual[syntax]>=0.68.0",
    "uv>=0.4.0",
    "textual-autocomplete>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=7.4.0",
]

[project.scripts]
totebag = "totebag:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
